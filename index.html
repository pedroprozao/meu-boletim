<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - Noite sob a Árvore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fundo do Céu: Estrelas e Lua -->
  <div class="sky-container">
    <div class="estrelas"></div>
    <div class="lua-realista">
      <div class="cratera c1"></div>
      <div class="cratera c2"></div>
      <div class="cratera c3"></div>
      <div class="cratera c4"></div>
      <div class="cratera c5"></div>
      <div class="cratera c6"></div>
      <div class="brilho-incidente"></div>
    </div>
  </div>

  <!-- Brisa Noturna e Partículas de Vento -->
  <div class="vento-container">
    <div class="linha-vento v1"></div>
    <div class="linha-vento v2"></div>
    <div class="linha-vento v3"></div>
    <div class="folha-voando f1">🍃</div>
    <div class="folha-voando f2">🍂</div>
  </div>

  <!-- Campo de Gramado Hiper-Realista Balançando -->
  <div class="gramado-realista">
    <div class="fio-grama g1"></div>
    <div class="fio-grama g2"></div>
    <div class="fio-grama g3"></div>
    <div class="fio-grama g4"></div>
    <div class="fio-grama g5"></div>
    <div class="fio-grama g6"></div>
    <div class="fio-grama g7"></div>
    <div class="fio-grama g8"></div>
    <div class="fio-grama g9"></div>
    <div class="fio-grama g10"></div>
  </div>

  <!-- Controle de Sons da Noite -->
  <div class="painel-audio">
    <button id="btn-som" class="btn-audio">🔊 Ativar Sons da Noite</button>
  </div>

  <!-- Cenário da Mesa com o Papel e as Mãos -->
  <div class="mesa-cenario">
    
    <!-- Mão Esquerda Segurando a Borda -->
    <div class="mao-realista mao-esq">
      <div class="pulso-real"></div>
      <div class="palma-real"></div>
      <div class="dedo-real d-polegar"></div>
      <div class="dedo-real d-indicador"></div>
      <div class="dedo-real d-medio"></div>
    </div>

    <!-- Mão Direita Segurando a Borda -->
    <div class="mao-realista mao-dir">
      <div class="pulso-real"></div>
      <div class="palma-real"></div>
      <div class="dedo-real d-polegar"></div>
      <div class="dedo-real d-indicador"></div>
      <div class="dedo-real d-medio"></div>
    </div>

    <!-- O Papel do Boletim -->
    <div class="folha-papel">
      <div class="iluminacao-lua-papel"></div>
      <div class="textura-dobra"></div>

      <!-- Cabeçalho -->
      <header class="cabecalho">
        <div class="brasao-escola">🏫</div>
        <h1>Boletim Digital</h1>
        <p class="subtitulo">9º Ano — Estudante Exemplo</p>
      </header>

      <!-- Cards de Resumo -->
      <section class="cards-resumo">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="card-media">—</p>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="card-faltas">—</p>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-desempenho">—</p>
        </div>
        <div class="card">
          <h3>Atenção</h3>
          <p id="card-atencao">—</p>
        </div>
        <div class="card">
          <h3>Frequência</h3>
          <p id="card-frequencia">92%</p>
          <span class="status-frequencia">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela de Disciplinas -->
      <main class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As 15 linhas serão inseridas via JavaScript -->
          </tbody>
        </table>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - Noite sob a Árvore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Céu Noturno com Lua Realista -->
  <div class="sky-container">
    <div class="lua-realista">
      <div class="cratera c1"></div>
      <div class="cratera c2"></div>
      <div class="cratera c3"></div>
      <div class="cratera c4"></div>
      <div class="cratera c5"></div>
    </div>
  </div>

  <!-- Animação de Vento no Ar -->
  <div class="vento-container">
    <div class="linha-vento v1"></div>
    <div class="linha-vento v2"></div>
    <div class="linha-vento v3"></div>
  </div>

  <!-- Campo de Grama Balançando no Vento (Rodapé) -->
  <div class="gramado">
    <div class="grama g1"></div>
    <div class="grama g2"></div>
    <div class="grama g3"></div>
    <div class="grama g4"></div>
    <div class="grama g5"></div>
    <div class="grama g6"></div>
  </div>

  <!-- Painel de Som -->
  <div class="painel-audio">
    <button id="btn-som" class="btn-audio">🔊 Ativar Sons da Noite</button>
  </div>

  <!-- Cenário do Boletim na Folha de Papel -->
  <div class="mesa-cenario">
    
    <!-- Mão Esquerda Segurando o Papel -->
    <div class="mao-container mao-esquerda">✋</div>

    <!-- Mão Direita Segurando o Papel -->
    <div class="mao-container mao-direita">🤚</div>

    <!-- Papel do Boletim -->
    <div class="folha-papel">
      <div class="textura-dobra"></div>

      <!-- Cabeçalho -->
      <header class="cabecalho">
        <h1>Boletim Digital</h1>
        <p class="subtitulo">9º Ano — Estudante Exemplo</p>
      </header>

      <!-- Cards de Resumo -->
      <section class="cards-resumo">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="card-media">—</p>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="card-faltas">—</p>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-desempenho">—</p>
        </div>
        <div class="card">
          <h3>Atenção</h3>
          <p id="card-atencao">—</p>
        </div>
        <div class="card">
          <h3>Frequência</h3>
          <p id="card-frequencia">92%</p>
          <span class="status-frequencia">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela de Disciplinas -->
      <main class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão inseridas pelo JavaScript -->
          </tbody>
        </table>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

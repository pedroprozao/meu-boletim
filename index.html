<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - Noite sob a Árvore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lua com brilho noturno -->
  <div class="lua"></div>

  <!-- Camadas da animação de vento suave -->
  <div class="vento-bg"></div>
  <div class="folhas-vento"></div>

  <!-- Painel de Áudio Ambient (Vento e Grilos) -->
  <div class="painel-audio">
    <button id="btn-som" class="btn-audio">🔊 Ativar Sons da Noite</button>
  </div>

  <!-- Cenário: Folha de Papel (Boletim) na Mesa sob a Árvore -->
  <div class="cenario-papel">
    
    <!-- Mão segurando a borda do papel -->
    <div class="mao-ilustracao">✋</div>

    <div class="container-boletim">
      <!-- Cabeçalho do Boletim -->
      <header class="cabecalho">
        <h1>Boletim Digital</h1>
        <p class="subtitulo">9º Ano — Estudante Exemplo</p>
      </header>

      <!-- Cards de Resumo -->
      <section class="cards-resumo">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="card-media">—</p>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="card-faltas">—</p>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-desempenho">—</p>
        </div>
        <div class="card">
          <h3>Atenção</h3>
          <p id="card-atencao">—</p>
        </div>
        <div class="card">
          <h3>Frequência</h3>
          <p id="card-frequencia">92%</p>
          <span class="status-frequencia">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela de Disciplinas -->
      <main class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas da tabela serão inseridas via JavaScript -->
          </tbody>
        </table>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

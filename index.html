<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - Noite sob a Árvore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====================================================================
       1. CAMADAS ATMOSFÉRICAS E CLIMA DINÂMICO (20% CHANCE DE CHUVA)
       ==================================================================== -->
  <div id="camada-chuva" class="chuva-container"></div>
  <div id="camada-raio" class="raio-flash"></div>
  <div class="luz-ambiente-noturna"></div>

  <!-- ====================================================================
       2. CÉU NOTURNO, ESTRELAS MULTICAMADAS E NEBLINA
       ==================================================================== -->
  <div class="sky-container">
    <div class="neblina-noturna n1"></div>
    <div class="neblina-noturna n2"></div>
    <div class="neblina-noturna n3"></div>
    <div class="estrelas-camada1"></div>
    <div class="estrelas-camada2"></div>
    <div class="estrelas-camada3"></div>
    
    <!-- Lua Realista 3D com Crateras e Aura -->
    <div class="lua-realista-3d">
      <div class="lua-terminador"></div>
      <div class="cratera c1"></div>
      <div class="cratera c2"></div>
      <div class="cratera c3"></div>
      <div class="cratera c4"></div>
      <div class="cratera c5"></div>
      <div class="cratera c6"></div>
      <div class="cratera c7"></div>
      <div class="brilho-superficie"></div>
    </div>
  </div>

  <!-- ====================================================================
       3. ÁRVORE NOTURNA ESTILO GOOGLE EM CSS 3D
       ==================================================================== -->
  <div class="arvore-cenario">
    <div class="tronco-raiz-esq"></div>
    <div class="tronco-raiz-dir"></div>
    <div class="tronco-principal"></div>
    <div class="textura-casca c1"></div>
    <div class="textura-casca c2"></div>
    <div class="galho g-esq-baixo"></div>
    <div class="galho g-esq-alto"></div>
    <div class="galho g-dir-baixo"></div>
    <div class="galho g-dir-alto"></div>
    
    <!-- Folhagem e Copas em Camadas -->
    <div class="copa-folhas c-fundo1"></div>
    <div class="copa-folhas c-fundo2"></div>
    <div class="copa-folhas c-meio-esq"></div>
    <div class="copa-folhas c-meio-dir"></div>
    <div class="copa-folhas c-topo-centro"></div>
    <div class="copa-folhas c-frente-baixo"></div>
  </div>

  <!-- ====================================================================
       4. CAMPO DE GRAMA AMPLIADO NOTURNO
       ==================================================================== -->
  <div class="campo-gramado-amplo">
    <div class="grama-profunda"></div>
    <div class="camada-fios-grama">
      <div class="fio g1"></div><div class="fio g2"></div><div class="fio g3"></div>
      <div class="fio g4"></div><div class="fio g5"></div><div class="fio g6"></div>
      <div class="fio g7"></div><div class="fio g8"></div><div class="fio g9"></div>
      <div class="fio g10"></div><div class="fio g11"></div><div class="fio g12"></div>
    </div>
  </div>

  <!-- ====================================================================
       5. VENTO FLUTUANTE E PARTICULAS
       ==================================================================== -->
  <div class="vento-container">
    <div class="linha-vento v1"></div>
    <div class="linha-vento v2"></div>
    <div class="linha-vento v3"></div>
    <div class="folha-voando f1">🍃</div>
    <div class="folha-voando f2">🍂</div>
    <div class="folha-voando f3">🌿</div>
  </div>

  <!-- Painel de Controle Áudio -->
  <div class="painel-audio">
    <button id="btn-som" class="btn-audio">🔊 Ativar Sons da Noite</button>
  </div>

  <!-- ====================================================================
       6. CENÁRIO CENTRAL: MÃOS ANATÔMICAS E BOLETIM EM PAPEL
       ==================================================================== -->
  <div class="mesa-cenario">
    
    <!-- Mão Esquerda Anatômica em CSS -->
    <div class="mao-anatomica mao-esquerda">
      <div class="braco-pulso"></div>
      <div class="palma-base"></div>
      <div class="dedo-completo polegar"><div class="unha"></div></div>
      <div class="dedo-completo indicador"><div class="dobra"></div><div class="unha"></div></div>
      <div class="dedo-completo medio"><div class="dobra"></div><div class="unha"></div></div>
      <div class="dedo-completo anelar"><div class="dobra"></div><div class="unha"></div></div>
      <div class="dedo-completo minimo"><div class="dobra"></div><div class="unha"></div></div>
    </div>

    <!-- Mão Direita Anatômica em CSS -->
    <div class="mao-anatomica mao-direita">
      <div class="braco-pulso"></div>
      <div class="palma-base"></div>
      <div class="dedo-completo polegar"><div class="unha"></div></div>
      <div class="dedo-completo indicador"><div class="dobra"></div><div class="unha"></div></div>
      <div class="dedo-completo medio"><div class="dobra"></div><div class="unha"></div></div>
      <div class="dedo-completo anelar"><div class="dobra"></div><div class="unha"></div></div>
      <div class="dedo-completo minimo"><div class="dobra"></div><div class="unha"></div></div>
    </div>

    <!-- Papel do Boletim -->
    <div class="folha-papel-real">
      <div class="luz-lua-incidente"></div>
      <div class="dobra-canto"></div>

      <!-- Cabeçalho -->
      <header class="cabecalho">
        <div class="brasao-escola">🏫</div>
        <h1>Boletim Digital</h1>
        <p class="subtitulo">9º Ano — Estudante Exemplo</p>
      </header>

      <!-- Cards de Resumo -->
      <section class="cards-resumo">
        <div class="card">
          <h3>Média Geral</h3>
          <p id="card-media">—</p>
        </div>
        <div class="card">
          <h3>Total de Faltas</h3>
          <p id="card-faltas">—</p>
        </div>
        <div class="card">
          <h3>Bom Desempenho</h3>
          <p id="card-bom-desempenho">—</p>
        </div>
        <div class="card">
          <h3>Atenção</h3>
          <p id="card-atencao">—</p>
        </div>
        <div class="card">
          <h3>Frequência</h3>
          <p id="card-frequencia">92%</p>
          <span class="status-frequencia">Frequência adequada</span>
        </div>
      </section>

      <!-- Tabela de Disciplinas -->
      <main class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As 15 disciplinas serão geradas via JavaScript -->
          </tbody>
        </table>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

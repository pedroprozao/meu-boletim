<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Camada para animação de vento suave -->
  <div class="vento-bg"></div>

  <!-- Iluminação e efeito de lua no fundo -->
  <div class="lua"></div>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">9º Ano — Estudante Exemplo</p>
    </header>

    <!-- Cards de Resumo -->
    <section class="cards-resumo">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media">—</p>
      </div>
      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-faltas">—</p>
      </div>
      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho">—</p>
      </div>
      <div class="card">
        <h3>Atenção</h3>
        <p id="card-atencao">—</p>
      </div>
      <div class="card">
        <h3>Frequência</h3>
        <p id="card-frequencia">92%</p>
        <span class="status-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Disciplinas -->
    <main class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- As linhas da tabela serão inseridas via JavaScript -->
        </tbody>
      </table>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
